name: shoping67 checks
on:
  push:
    branches: [codex/shop-cart-demo]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Tooded_2.slnx
      - run: dotnet build Tooded_2.slnx --no-restore
      - run: dotnet run --project Tests/Shop.CoreChecks
      - run: dotnet run --project Tooded_2 --no-build -- --ui-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shoping67-ui
          path: ui-checks/*.png
          if-no-files-found: ignore
